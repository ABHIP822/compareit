<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./website%20intro%20javascript.js"></script>
    <link rel="stylesheet"href="login code css.css">
    <meta charset="utf-8">
    <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">
    <title>COMPAREIT - Sing Up</title>
    <link rel="stylesheet"href="login code css.css">
</head>
<body>

    <form>
        <h1>Welcome to CompareIt</h1>
        <p>Create your profile to get started</p>
        <label for="name">Name</label>
        <input type="text" id="Name"
        placeholder="your name"required>

        <label for="age">Age</label>
        <input type="number"id="age"
        placeholder="Your age" required>

        <label for="=gender">Gender</label>
        <select id="gender" required>
            <option value=""disabled
            selected>select gender</option>
            <option value="male">male</option>
            <option value="female">Female</option>
            <option value="other">other</option>
        </select>

        <label for="email">Email</label>
        <input type="email"id="email"
        placeholder="you@example.com" required>

        <label for="password">password</label>
        <input type="password"id="password"
        placeholder="Min 6 characters" required>

        <button type="submit">Create profile & Sign UP</button>
        <p><a href="#">Already have an account? Log in</a></p>
        <a href="home page html.html"><button type="button" id="guestbutton">Continue as Guest</button></a>
        </form>
        <script src="login code.js"></script>
</body>
</html>
